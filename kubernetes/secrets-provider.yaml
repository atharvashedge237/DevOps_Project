# This file defines Kubernetes resources for Azure Key Vault secret access in AKS using the CSI Secrets Store driver and Azure Pod Identity.
# This file sets up:

# the identity and permissions
# the Key Vault secret mapping
# the Kubernetes objects required to let AKS pods securely fetch secrets from Azure Key Vault

apiVersion: v1
kind: Namespace
metadata:
  name: kube-system
---
# Azure Key Vault CSI Driver - Secret Provider
apiVersion: v1
kind: ServiceAccount
metadata:
  name: csi-secrets-provider
  namespace: kube-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: secrets-provider
  namespace: production
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: secrets-provider
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "create", "update", "patch"]
- apiGroups: [""]
  resources: ["serviceaccounts"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: secrets-provider
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: secrets-provider
subjects:
- kind: ServiceAccount
  name: secrets-provider
  namespace: production
---
# Example SecretProviderClass for Azure Key Vault integration
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: azure-keyvault-provider
  namespace: production
spec:
  provider: azure
  parameters:
    usePodIdentity: "true"
    useVMManagedIdentity: "false"
    keyvaultName: "mlops-vault"
    cloudName: "AzurePublicCloud"
    objects: |
      array:
        - |
          objectName: openai-api-key
          objectType: secret
          objectAlias: OPENAI_API_KEY
        - |
          objectName: db-connection-string
          objectType: secret
          objectAlias: DB_CONNECTION_STRING
    tenantID: "YOUR_TENANT_ID"
---
# Pod Identity Binding for AKS
apiVersion: aadpodidentity.k8s.io/v1
kind: AzureIdentity
metadata:
  name: mlops-identity
  namespace: production
spec:
  type: 0  # Managed identity type
  resourceID: /subscriptions/SUBSCRIPTION_ID/resourcegroups/mlops-rg/providers/Microsoft.ManagedIdentity/userAssignedIdentities/mlops-identity
  clientID: "CLIENT_ID_OF_MANAGED_IDENTITY"
---
apiVersion: aadpodidentity.k8s.io/v1
kind: AzureIdentityBinding
metadata:
  name: mlops-identity-binding
  namespace: production
spec:
  azureIdentity: mlops-identity
  selector: mlops-api
---
# Example: Kubernetes Secret with Key Vault data
apiVersion: v1
kind: Secret
metadata:
  name: mlops-secrets
  namespace: production
type: Opaque
stringData:
  # These will be injected from Azure Key Vault via CSI driver
  OPENAI_API_KEY: "placeholder-from-keyvault"
  DB_CONNECTION_STRING: "placeholder-from-keyvault"
