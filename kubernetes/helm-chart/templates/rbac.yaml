{{- if .Values.rbac.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "mlops-api.serviceAccountName" . }}
  labels:
    {{- include "mlops-api.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
---
{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "mlops-api.fullname" . }}
  labels:
    {{- include "mlops-api.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]
{{- end }}
---
{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "mlops-api.fullname" . }}
  labels:
    {{- include "mlops-api.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "mlops-api.fullname" . }}
subjects:
- kind: ServiceAccount
  name: {{ include "mlops-api.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- end }}
